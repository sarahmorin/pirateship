workdir = "cloudlab_pirateship_sweep"
project_home = "https://github.com/sarahmorin/pirateship"

[deployment_config]
mode = "manual"
ssh_key = "~/.ssh/id_ed25519"
ssh_user = "nurzhana"
node_port_base = 3000

# CloudLab node list - hp nodes Utah
[deployment_config.node_list]

[deployment_config.node_list.nodepool_vm0]
private_ip = "10.10.1.1"
public_ip = "hp078.utah.cloudlab.us"
tee_type = "nontee"
region_id = 0

[deployment_config.node_list.nodepool_vm1]
private_ip = "10.10.1.2"
public_ip = "hp021.utah.cloudlab.us"
tee_type = "nontee"
region_id = 0

[deployment_config.node_list.nodepool_vm2]
private_ip = "10.10.1.3"
public_ip = "hp034.utah.cloudlab.us"
tee_type = "nontee"
region_id = 0

[deployment_config.node_list.nodepool_vm3]
private_ip = "10.10.1.4"
public_ip = "hp023.utah.cloudlab.us"
tee_type = "nontee"
region_id = 0

[deployment_config.node_list.clientpool_vm0]
private_ip = "10.10.1.5"
public_ip = "hp064.utah.cloudlab.us"
tee_type = "nontee"
region_id = 0

[node_config]

[node_config.net_config]
client_max_retry = 10

[node_config.rpc_config]
recv_buffer_size = 32768
channel_depth = 1000

[node_config.consensus_config]
commit_index_gap_soft = 250
commit_index_gap_hard = 500
liveness_u = 2
max_backlog_batch_size = 1000
signature_max_delay_blocks = 50
signature_max_delay_ms = 102
num_crypto_workers = 5
view_timeout_ms = 4000
batch_max_delay_ms = 2

[node_config.consensus_config.log_storage_config.RocksDB]
write_buffer_size = 2147483648
max_write_buffer_number = 1
max_write_buffers_to_merge = 1

[node_config.app_config]
logger_stats_report_ms = 100
checkpoint_interval_ms = 60000

[node_config.evil_config]
simulate_byzantine_behavior = false
byzantine_start_block = 0

[client_config]
full_duplex = true
client_sub_id = 0

[client_config.net_config]
client_max_retry = 10

[client_config.workload_config]
request_config = "Blanks"
max_concurrent_requests = 16

# Main PirateShip experiment with client sweep
[[experiments]]
name = "pirateship_sweep"
repeats = 1
num_nodes = 4
node_distribution = "uniform"
build_command = "make"
duration = 60

[experiments.sweeping_parameters]
# 4-node baseline sweep: Focus on working range (< 500 clients)
# Peak at 300 clients (147 ktps), saturation around 500 clients
num_clients = [100, 200, 300, 400, 500]

# Results configuration
[[results]]
name = "tput_latency_client_sweep"
plotter = "tput_latency_sweep"
ramp_up = 10
ramp_down = 10
output = "pirateship_sweep.pdf"
force_parse = true

[results.legends]
pirateship_sweep = "PirateShip"

[results.font]
size = 55
