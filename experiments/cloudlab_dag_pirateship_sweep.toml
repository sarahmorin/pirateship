# =============================================================================
# NODE CONFIGURATION
# =============================================================================
[node_config]

[node_config.net_config]
client_max_retry = 10

[node_config.rpc_config]
recv_buffer_size = 32768
channel_depth = 1000

[node_config.consensus_config]
commit_index_gap_soft = 250
commit_index_gap_hard = 500
liveness_u = 2
max_backlog_batch_size = 1000
signature_max_delay_blocks = 10
signature_max_delay_ms = 102
num_crypto_workers = 5
view_timeout_ms = 4000
batch_max_delay_ms = 2

[node_config.consensus_config.log_storage_config.RocksDB]
db_path = "/tmp/testdb"
write_buffer_size = 2147483648
max_write_buffer_number = 1
max_write_buffers_to_merge = 1

[node_config.app_config]
logger_stats_report_ms = 100
checkpoint_interval_ms = 60000

[node_config.evil_config]
simulate_byzantine_behavior = false
byzantine_start_block = 0

# =============================================================================
# CLIENT CONFIGURATION (DAG Workload)
# =============================================================================
[client_config]
full_duplex = true
client_sub_id = 0

[client_config.net_config]
client_max_retry = 10

[client_config.workload_config]
request_config = "BlanksDAG"  # DAG workload with 512-byte random payloads
max_concurrent_requests = 32  # Higher concurrency for DAG

# =============================================================================
# EXPERIMENTS: DAG PirateShip Client Sweep
# =============================================================================

# DAG PirateShip with sig=10
[[experiments]]
name = "dag_pirateship_sig10"
group_name = "DAG PirateShip (sig=10)"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make dag_pirateship_logger"
duration = 60

[experiments.node_config.consensus_config]
signature_max_delay_blocks = 10

[experiments.sweeping_parameters]
num_clients = [10, 50, 100, 200, 300, 400, 500]  # From baseline to saturation

# DAG PirateShip with sig=50
[[experiments]]
name = "dag_pirateship_sig50"
group_name = "DAG PirateShip (sig=50)"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make dag_pirateship_logger"
duration = 60

[experiments.node_config.consensus_config]
signature_max_delay_blocks = 50

[experiments.sweeping_parameters]
num_clients = [10, 50, 100, 200, 300, 400, 500]  # From baseline to saturation

# =============================================================================
# RESULTS
# =============================================================================
[[results]]
name = "dag_pirateship_sweep"
plotter = "tput_latency_sweep"
ramp_up = 10
ramp_down = 10
output = "dag_pirateship_sweep.pdf"
force_parse = true

[results.legends]
"DAG PirateShip (sig=10)" = "DAG PirateShip (sig=10)"
"DAG PirateShip (sig=50)" = "DAG PirateShip (sig=50)"

[results.font]
size = 55

