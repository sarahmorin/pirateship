# =============================================================================
# NODE CONFIGURATION
# =============================================================================
[node_config]

[node_config.net_config]
client_max_retry = 10

[node_config.rpc_config]
recv_buffer_size = 32768
channel_depth = 1000

[node_config.consensus_config]
commit_index_gap_soft = 250
commit_index_gap_hard = 500
liveness_u = 2
max_backlog_batch_size = 1000
signature_max_delay_blocks = 50
signature_max_delay_ms = 102
num_crypto_workers = 5
view_timeout_ms = 4000
batch_max_delay_ms = 2

[node_config.consensus_config.log_storage_config.RocksDB]
db_path = "/tmp/testdb"
write_buffer_size = 2147483648
max_write_buffer_number = 1
max_write_buffers_to_merge = 1

[node_config.app_config]
logger_stats_report_ms = 100
checkpoint_interval_ms = 60000

[node_config.evil_config]
simulate_byzantine_behavior = false
byzantine_start_block = 0

# =============================================================================
# CLIENT CONFIGURATION
# =============================================================================
[client_config]
full_duplex = true
client_sub_id = 0

[client_config.net_config]
client_max_retry = 10

[client_config.workload_config]
request_config = "Blanks"
max_concurrent_requests = 32  # Higher concurrency enables better batching

# =============================================================================
# EXPERIMENTS: Protocol Comparison
# PirateShip (sig=10 vs sig=50) vs Signed Raft
# =============================================================================

# PirateShip with sig=10 (balanced signing)
[[experiments]]
name = "pirateship_sig10"
group_name = "PirateShip (sig=10)"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make"
duration = 60

[experiments.node_config.consensus_config]
signature_max_delay_blocks = 10

[experiments.sweeping_parameters]
num_clients = [10, 50, 100, 200, 300, 400, 500]  # From baseline to saturation

# PirateShip with sig=50 (less frequent signing)
[[experiments]]
name = "pirateship_sig50"
group_name = "PirateShip (sig=50)"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make"
duration = 60

[experiments.node_config.consensus_config]
signature_max_delay_blocks = 50

[experiments.sweeping_parameters]
num_clients = [10, 50, 100, 200, 300, 400, 500]  # From baseline to saturation

# Signed Raft (5 nodes for f=2 tolerance)
[[experiments]]
name = "signed_raft"
group_name = "Signed Raft"
repeats = 1
num_nodes = 5
node_distribution = "uniform"
build_command = "make signed_raft_logger"
duration = 60

[experiments.sweeping_parameters]
num_clients = [10, 50, 100, 200, 300, 400, 500]  # From baseline to saturation

# =============================================================================
# RESULTS
# =============================================================================
[[results]]
name = "protocol_comparison"
plotter = "tput_latency_sweep"
ramp_up = 10
ramp_down = 10
output = "protocol_comparison.pdf"
force_parse = true

[results.legends]
"PirateShip (sig=10)" = "PirateShip (sig=10)"
"PirateShip (sig=50)" = "PirateShip (sig=50)"
"Signed Raft" = "Signed Raft"

[results.font]
size = 55

