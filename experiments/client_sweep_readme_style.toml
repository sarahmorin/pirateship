# Results: latency vs throughput scatter (client sweep)
[[results]]
name = "latency_throughput_client_sweep"
plotter = "tput_latency_sweep"
ramp_up = 10
ramp_down = 10
output = "latency_throughput_client_sweep.pdf"
force_parse = true

[results.legends]
pirateship_sig1 = "PirateShip (sig=1, n=7)"
pirateship_sig10 = "PirateShip (sig=10, n=7)"
signed_raft_n7 = "Signed Raft (n=7)"
