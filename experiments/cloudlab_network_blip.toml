# =============================================================================
# BASE NODE/CLIENT CONFIG
# =============================================================================
[node_config]

[node_config.net_config]
client_max_retry = 10

[node_config.rpc_config]
recv_buffer_size = 32768
channel_depth = 1000

[node_config.consensus_config]
commit_index_gap_soft = 250
commit_index_gap_hard = 500
liveness_u = 2
max_backlog_batch_size = 1000
signature_max_delay_blocks = 50
signature_max_delay_ms = 102
num_crypto_workers = 5
view_timeout_ms = 4000
batch_max_delay_ms = 2

[node_config.consensus_config.log_storage_config.RocksDB]
db_path = "/tmp/testdb"
write_buffer_size = 2147483648
max_write_buffer_number = 1
max_write_buffers_to_merge = 1

[node_config.app_config]
logger_stats_report_ms = 100
checkpoint_interval_ms = 60000

[node_config.evil_config]
simulate_byzantine_behavior = false
byzantine_start_block = 0

[client_config]
full_duplex = true
client_sub_id = 0

[client_config.net_config]
client_max_retry = 10

[client_config.workload_config]
request_config = "Blanks"
max_concurrent_requests = 32

# =============================================================================
# EXPERIMENTS: network blip recovery / hangover
# =============================================================================

# Baseline Pirateship (non-DAG), with a 2s blip on a single follower (node4).
[[experiments]]
name = "pirateship_blip"
group_name = "PirateShip"
type = "network_blip"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make"
duration = 90

[[experiments.network_blips]]
name = "blip_node4"
start_s = 40
duration_s = 2
targets = ["node4"]

[experiments.sweeping_parameters]
num_clients = [400]

# DAG Pirateship, same blip.
[[experiments]]
name = "dag_pirateship_blip"
group_name = "DAG PirateShip"
type = "network_blip"
repeats = 1
num_nodes = 7
node_distribution = "uniform"
build_command = "make dag_pirateship_logger"
duration = 90

[[experiments.network_blips]]
name = "blip_node4"
start_s = 40
duration_s = 2
targets = ["node4"]

[experiments.node_config.dag_config]
tip_cut_delay_ms = 100
tip_cut_max_cars = 0

[experiments.client_config.workload_config]
request_config = "BlanksDAG"

[experiments.sweeping_parameters]
num_clients = [400]

# =============================================================================
# RESULTS: commit vs audit throughput time series with blip markers
# =============================================================================
[[results]]
name = "network_blip_timeseries"
plotter = "crash_byz_tput_timeseries"
ramp_up = 10
ramp_down = 10
output = "network_blip_timeseries.pdf"
force_parse = true
target_node = "node1"
sample_rate = 10

[results.font]
size = 55

[[results.events]]
name = "blip_start"
pattern = "\\[INFO\\]\\[pft::experiment::blip\\]\\[(.*)\\] NETBLIP START name=blip_node4"
target = "node4"
description = "Blip\\nstart"

[[results.events]]
name = "blip_end"
pattern = "\\[INFO\\]\\[pft::experiment::blip\\]\\[(.*)\\] NETBLIP END name=blip_node4"
target = "node4"
description = "Blip\\nend"


