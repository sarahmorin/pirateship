# Results: throughput vs node count (bars)
[[results]]
name = "leader_node_scaling"
plotter = "stacked_bar_graph"
ramp_up = 10
ramp_down = 10
output = "leader_node_scaling.pdf"
force_parse = true
xlabels = ["4", "5", "6", "7", "8", "9"]

[results.legends]
pirateship = "PirateShip"
signed_raft = "Signed Raft"

[results.font]
size = 55

